name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install Inno Setup and Poppler
        run: choco install innosetup poppler -y
      - name: Create dummy key for tests
        run: |
          New-Item -ItemType Directory -Force -Path "seller_kit"
          python -c "from cryptography.hazmat.primitives.asymmetric import ed25519; from cryptography.hazmat.primitives import serialization; k = ed25519.Ed25519PrivateKey.generate(); open('seller_kit/private_key.pem', 'wb').write(k.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))"
      - name: Build installer
        run: .\build_windows.bat
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BatiPlanStudio_Setup
          path: Output/*.exe
