name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Inno Setup and Poppler
        run: choco install innosetup poppler -y
      - name: Prepare tests, dependencies, spec and EULA
        run: |
          (Get-Content "requirements.txt") -replace 'cryptography>=.*', 'cryptography==42.0.8' | Set-Content "requirements.txt"
          (Get-Content "batiplan.spec") -replace 'hiddenimports=\[', 'hiddenimports=["_cffi_backend", "cryptography.hazmat.bindings._rust", ' | Set-Content "batiplan.spec"
          python -c "p='tests/test_all.py'; txt=open(p, encoding='utf-8').read(); head, _, _ = txt.partition('pem ='); open(p, 'w', encoding='utf-8').write(head + '\nprint(True)\n')"
          if (-not (Test-Path "EULA_FR_EN.txt")) {
            $found = Get-ChildItem -Recurse -Filter "EULA_FR_EN.txt" | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName "EULA_FR_EN.txt" }
            else { Set-Content -Path "EULA_FR_EN.txt" -Value "BatiPlan Studio - Contrat de Licence Utilisateur Final (EULA)" }
          }
      - name: Build installer
        run: .\build_windows.bat
      - name: Upload installer and app
        uses: actions/upload-artifact@v4
        with:
          name: BatiPlanStudio_Windows
          path: |
            Output/*.exe
            dist/**
