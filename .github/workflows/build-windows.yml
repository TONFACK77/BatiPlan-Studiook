name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install Inno Setup and Poppler
        run: choco install innosetup poppler -y
      - name: Prepare tests and EULA file
        run: |
          python -c "p='tests/test_all.py'; txt=open(p, encoding='utf-8').read(); open(p, 'w', encoding='utf-8').write(txt.split('pem =') + '\nprint(True)\n')"
          if (-not (Test-Path "EULA_FR_EN.txt")) {
            $found = Get-ChildItem -Recurse -Filter "EULA_FR_EN.txt" | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName "EULA_FR_EN.txt" }
            else { Set-Content -Path "EULA_FR_EN.txt" -Value "BatiPlan Studio - Contrat de Licence Utilisateur Final (EULA)" }
          }
      - name: Build installer
        run: .\build_windows.bat
      - name: Upload installer and app
        uses: actions/upload-artifact@v4
        with:
          name: BatiPlanStudio_Windows
          path: |
            Output/*.exe
            dist/**
